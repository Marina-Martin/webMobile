<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Busca Lar - Cadastrar Pet</title>
  <link rel="stylesheet" href="formsStyle.css">
  <script src="formsScript.js" defer></script>
</head>
<body>

  <header>
    <h1><a href="home.html">Busca Lar</a></h1>
    <nav>
      <ul>
        <button class="bnt" onclick="mostrarPopup()">Busca Pet</button>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Cadastre seu Pet</h2>
    <form>
      <fieldset>
        <legend>Informações do Pet</legend>
        <p>
          <label for="nome-pet">Nome:</label>
          <input class="inputs" type="text" id="nome-pet" name="nome-pet">
        </p>
        <p>
          <label for="animal">Espécie:</label>
          <select class="inputs" id="animal" name="animal">
            <option>Cachorro</option>
            <option>Gato</option>
            <option>Outro</option>
          </select>
        </p>
        <p>
          <label for="descricao">Descrição:</label>
          <textarea class="inputs" id="descricao" name="descricao"></textarea>
        </p>
        <p>
          <label for="foto-pet">Foto:</label>
          <input class="inputs" type="file" id="foto-pet" name="foto-pet">
        </p>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>
        <p>
          <label for="cidade">Cidade:</label>
          <input class="inputs" type="text" id="cidade" name="cidade">
        </p>
        <p>
          <label for="estado">Estado:</label>
          <input class="inputs" type="text" id="estado" name="estado">
        </p>
        <p>
          <label for="email">E-mail:</label>
          <input class="inputs" type="email" id="email" name="email">
        </p>
      </fieldset>

      <p class="botoes-form">
        <button class="btn" type="submit">Enviar</button>
        <button class="btn" type="reset">Limpar</button>
      </p>
    </form>
  </main>

  <footer>
    <p>© 2025 Busca Lar - Todos os direitos reservados</p>
  </footer>
</body>
</html>
